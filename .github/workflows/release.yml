name: Release

# Se dispara al empujar un tag de version (vMAJOR.MINOR.PATCH, con sufijo opcional: v1.2.0-rc.1).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derivar version del tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Compilar en Docker
        run: docker compose run --rm build

      - name: Checksums
        run: |
          # el contenedor crea dist/ como root
          sudo chown -R "$(id -u):$(id -g)" dist
          cd dist
          sha256sum FanCurve-${VERSION}-win-x64.zip > SHA256SUMS.txt

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FanCurve-${{ env.VERSION }}-win-x64.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          # v1.2.0-rc.1, v2.0.0-beta.1... se marcan como pre-release automaticamente
          prerelease: ${{ contains(github.ref_name, '-') }}
